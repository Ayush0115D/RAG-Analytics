services:
  - type: web
    name: rag-chatbot-api
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://your-vercel-app.vercel.app
